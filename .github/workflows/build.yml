name: Build

on:
  push:
  pull_request:
    branches: [ "main" ]
  # Lets you start a build by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:

    strategy:
      matrix:
        # configuration: [debug, release]
        configuration: [release]
        platform: [x64, x86, arm64]
        include:
          # windows-latest ships Visual Studio 2026; it keeps the VS 2022 (v143)
          # compiler for x64/x86 but not for ARM64, so ARM64 uses VS 2026's (v145).
          - platform: arm64
            toolset: /p:PlatformToolset=v145
      fail-fast: false

    env:
      SOLUTION_FILE_PATH: src/Shell.sln
      BUILD_CONFIGURATION: ${{matrix.configuration}}
      BUILD_PLATFORM: ${{matrix.platform}}
      BIN_PATH: ${{ github.workspace }}\src\bin
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: Build
      working-directory: ${{env.GITHUB_WORKSPACE}}
      run: msbuild /m /p:Configuration=${{env.BUILD_CONFIGURATION}} /p:Platform=${{env.BUILD_PLATFORM}} ${{matrix.toolset}} ${{env.SOLUTION_FILE_PATH}}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: shell-${{matrix.platform}}
        path: |
          ${{env.BIN_PATH}}\*
          !${{env.BIN_PATH}}\*.lib
          !${{env.BIN_PATH}}\*.exp
          !${{env.BIN_PATH}}\*.wixpdb
          !${{env.BIN_PATH}}\ca.dll
        if-no-files-found: warn
        retention-days: 0
        compression-level: 6
        overwrite: false
        include-hidden-files: false
